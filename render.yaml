# ==============================================================================
# Render Blueprint — Virtual CFO Backend
# ==============================================================================
# Deploy via: https://render.com/deploy → connect your GitHub repo
# Or use: render blueprint apply
# ==============================================================================

services:
  - type: web
    name: virtual-cfo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_URI
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TIMEOUT
        value: "15.0"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: legal_documents
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: HF_HUB_OFFLINE
        value: "0"
